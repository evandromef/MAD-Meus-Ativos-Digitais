<body>

        <h1><a href="../index.html">MAD - Meus Ativos Digitais</a></h1>

            <ul class="menu">

            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="box box-order-form" style="display: block;">
            <h2 class="box-title-1">Nova Ordem</h2>
            <form action="#" method="post">
                <div class="input-group">
                    <label for="asset" class="input-requerid">Ativo</label>
                    <select name="asset" id="asset" required>
                        <option value="">Selecione um ativo</option>
                        <option value="">ABEV3</option>
                        <option value="">VIVT3</option>
                        <option value="">RADL3</option>
                        <option value="">KNRI11</option>
                        <option value="">MXRF11</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="date" class="input-requerid">Data da Ordem</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="input-group">
                    <fieldset>
                        <legend class="input-requerid">Tipo de Ordem</legend>
                        <input type="radio"id="orderTypeBuy" name="orderType" value="buy" checked required>
                        <label for="orderTypeBuy" class="radio-label">Compra</label>
                        <input type="radio" id="orderTypeSell" name="orderType" value="sell" required>
                        <label for="orderTypeSell" class="radio-label">Venda</label>
                    </fieldset>                    
                </div>
                
                <div class="input-group">
                    <label for="quantity" class="input-requerid">Quantidade</label>
                    <input type="number" id="quantity" name="quantity" min="1" placeholder="Ex: 100"required>
                </div>
                
                <div class="input-group">
                    <label for="unitPrice" class="input-requerid">Preço</label>
                    <input type="number" id="unitPrice" name="price" step="0.01" min="0.01" placeholder="Ex: 30,00" required>
                </div>

                <div class="input-group">
                    <label for="totalPrice" class="input-requerid">Custo Total</label>
                    <input type="number" id="totalPrice" name="totalPrice" step="0.01" min="0.01" placeholder="Ex: 3000,00" required>
                </div>

                <div class="input-group">
                    <!-- <label for="brokerNote">Nota de corretagem:</label> -->
                    <fieldset>
                        <legend>Nota de corretagem</legend>
                        <input type="file" accept=".pdf" id="brokerNote" name="brokerNote">
                    </fieldset>
                </div>
                
                <div class="form-action-button">
                    <button type="submit" class="btn btn-confirm">Inserir Ordem</button>
                    <button type="submit" class="btn btn-cancel">Cancelar</button>
                </div>
            </form>
        </section>
    </main>
